name: ZAP baseline

# Passive only. The baseline scan spiders and reads; it never attacks. Do not
# swap this for zaproxy/action-full-scan against production — that one does
# send active payloads at whatever it is pointed at.
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: URL to scan
        default: https://vaky.me
        required: false

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_URL: ${{ inputs.target || 'https://vaky.me' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check whether the launch domain is reachable
        id: target
        shell: bash
        run: |
          if curl --silent --show-error --fail --head --max-time 20 "$TARGET_URL" > /dev/null; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "Skipping ZAP until $TARGET_URL is reachable."
          fi
      - uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25 # v0.15.0
        if: steps.target.outputs.ready == 'true'
        with:
          target: ${{ env.TARGET_URL }}
          # The run's artifacts carry the report; opening issues would need
          # write access to the repository, which this workflow does not have.
          allow_issue_writing: false
          cmd_options: "-a"
