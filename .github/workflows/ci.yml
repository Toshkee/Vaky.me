name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Third-party and first-party actions alike are pinned to a commit SHA: a tag
# can be moved to point at new code, a SHA cannot.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Both tsconfigs: the site against the DOM, and the Cloudflare Functions
      # against the Workers runtime. `npx tsc --noEmit` alone would skip the
      # second, which is now excluded from the root config.
      - run: npm run typecheck
      - run: npm run build
      # The Functions are compiled by the Pages build, not by `next build`, so
      # a broken one would only be found at deploy time otherwise.
      - run: npm run build:functions
      - run: npm audit --audit-level=high

  accessibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      # One step, because a process backgrounded in a `run` dies with the
      # shell that started it. The export is a directory of files; anything
      # that serves it will do.
      - name: Serve the export and run axe
        run: |
          python3 -m http.server 3000 --directory out &
          server=$!
          until curl -sf http://localhost:3000/ >/dev/null; do sleep 0.5; done
          npm run check:a11y -- http://localhost:3000
          status=$?
          kill $server
          exit $status

  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Gitleaks scans history, not just the tip.
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
