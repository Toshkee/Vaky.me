version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR per week for all safe npm updates instead of one PR per package.
      npm-minor-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Every major is a breaking change or a framework migration, so none of
      # them belong in an automated bump. The wildcard matters: a per-package
      # list only covers the deps that exist when it is written and silently
      # lets new majors through. Majors stay a deliberate, manual upgrade;
      # minor and patch still arrive grouped every week.
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Action SHA re-pins are noisy and always safe to batch.
      actions-all:
        patterns:
          - "*"
